name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/routines.json"
      - "data/active_targets.json"
      - "data/programs/**"
      - "scripts/*catalog*"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared catalog schema and content
        run: |
          pip install jsonschema==4.26.0
          python scripts/validate_catalog.py
          python scripts/test_catalog_validation.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /fitnotes
        run: npm run build

      - name: Check public catalog offline caching
        run: node scripts/test_catalog_service_worker.mjs

      - name: Verify exported JSON and schema bytes
        run: python scripts/validate_catalog.py --export

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
