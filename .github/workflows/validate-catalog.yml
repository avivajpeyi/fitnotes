name: Validate Workout Library
on:
  pull_request:
    paths: ['web/**', 'data/programs/**', 'scripts/*catalog*', '.github/workflows/*catalog*', '.github/workflows/deploy-pages.yml']
  push:
    branches: [main]
    paths: ['web/**', 'data/programs/**', 'scripts/*catalog*', '.github/workflows/*catalog*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.26.0
      - run: python scripts/validate_catalog.py
      - name: Preserve published version paths
        if: github.event_name == 'pull_request'
        env:
          CATALOG_BASE_REF: ${{ github.base_ref }}
        run: python scripts/validate_catalog.py --base "origin/$CATALOG_BASE_REF"
      - run: python scripts/test_catalog_validation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/test_catalog_service_worker.mjs
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /fitnotes
      - run: python scripts/validate_catalog.py --export
